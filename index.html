<script>
    'use strict';

    // دالة محاكاة لتسجيل السجلات في الواجهة بدل الـ Console لو رغبت
    window.ajyalLog = function(message) {
        console.log(message);
        const statusElement = document.getElementById("system-status");
        if (statusElement) {
            statusElement.innerText = message;
        }
    };

    // المتغيرات العامة وإعدادات التحكم
    window.appZoom = parseFloat(localStorage.getItem("ajyal_zoom_level")) || 1.0;
    window.uploadedExcelData = [];
    window.smartFillExecutionPlan = [];
    window.forcedPageNumber = 0;
    window.isEngineRunning = false;
    window.isAutopilotEnabled = false;
    let stopEngineFlag = false;
    let lastDetectedStatusText = "";
    window.currentSequentialSlice = [];
    window.currentActiveMode = "";

    // كائنات الذاكرة المؤقتة الطيارة
    let currentSessionPrintedMatches = {};
    let currentSessionHandwrittenMatches = {};
    let currentSessionSequentialMatches = {};

    function clearAllSessionMatches() {
        currentSessionPrintedMatches = {};
        currentSessionHandwrittenMatches = {};
        currentSessionSequentialMatches = {};
        window.ajyalLog("🗑️ [تنظيف تلقائي]: تم تدمير كافة التعديلات اليدوية السابقة لضمان عدم اختلاط الصفوف.");
    }

    // إعداد قاعدة بيانات الذاكرة المستقرة (IndexedDB)
    const DB_NAME = "AjyalExcelDB";
    const DB_VERSION = 1;
    const STORE_NAME = "excelDataStore";

    function initExcelDB() {
        return new Promise((resolve, reject) => {
            let request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = function(e) {
                let db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: "id" });
                }
            };
            request.onsuccess = function(e) { resolve(e.target.result); };
            request.onerror = function() { reject("IndexedDB Error"); };
        });
    }

    async function saveExcelToPersistentStorage(dataArray) {
        let db = await initExcelDB();
        let tx = db.transaction(STORE_NAME, "readwrite");
        let store = tx.objectStore(STORE_NAME);
        store.clear();
        store.add({ id: "current_file", data: dataArray });
        window.ajyalLog("💾 تم حفظ كشف الإكسل الأساسي في الجهاز بنجاح.");
    }

    async function loadExcelFromPersistentStorage() {
        let db = await initExcelDB();
        return new Promise((resolve) => {
            let tx = db.transaction(STORE_NAME, "readonly");
            let store = tx.objectStore(STORE_NAME);
            let request = store.get("current_file");
            request.onsuccess = function() {
                if(request.result) {
                    window.uploadedExcelData = request.result.data;
                    window.ajyalLog(`🔄 تم استعادة الكشف الأصلي تلقائياً: ${window.uploadedExcelData.length} طالب.`);
                    if(typeof window.renderExcelPreviewTable === "function") {
                        window.renderExcelPreviewTable();
                    }
                }
                resolve();
            };
            request.onerror = function() { resolve(); };
        });
    }

    // دالة المعايرة اللغوية للأسماء
    function normalizeArabicName(name) {
        if (!name) return "";
        let text = String(name).trim();
        text = text.replace(/[أإآأ]/g, "ا");
        text = text.replace(/ة/g, "ه");
        text = text.replace(/ى/g, "ي");
        text = text.replace(/عبد /g, "عبد");
        text = text.replace(/ال /g, "ال");
        text = text.replace(/\s+/g, " ");
        return text;
    }

    function getStringSimilarity(s1, s2) {
        if (!s1 || !s2) return 0;
        let longer = s1.length > s2.length ? s1 : s2;
        let shorter = s1.length > s2.length ? s2 : s1;
        if (longer.length === 0) return 1.0;
        return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
    }

    function editDistance(s1, s2) {
        let costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    function getValidStudentRows() {
        let table = document.getElementById("ctl00_PlaceHolderMain_gvDynamicStudentsMark");
        if (!table) return [];
        let trs = table.getElementsByTagName("tr");
        let validRows = [];
        for (let i = 0; i < trs.length; i++) {
            let row = trs[i];
            if (row.cells && row.cells.length > 3) {
                let firstCellText = row.cells[0].innerText.trim();
                if (/^\d{8,12}$/.test(firstCellText)) {
                    validRows.push(row);
                }
            }
        }
        return validRows;
    }

    function getStudentNameFromWebsiteRow(rowIndex) {
        let rows = getValidStudentRows();
        let rowElement = rows[rowIndex];
        if (rowElement) {
            let cellText = rowElement.cells[1].innerText.trim();
            let cleanText = cellText.replace(/حاضر/g, "").replace(/غائب/g, "").replace(/إجازة/g, "").trim();
            return cleanText.split('\n')[0].trim();
        }
        return "";
    }

    function getActualPageRowsCount() {
        return getValidStudentRows().length;
    }

                } else if (headerText.includes("الثالث")) {
                    openCols.push({ id: 4, label: "تقويم 3 الفردي" });
                } else if (headerText.includes("الثاني")) {
